# yaml-language-server: $schema=../../schemas/scenario.schema.json
schema_version: 1

id: card-success
title: Guest checkout with a card that succeeds without 3D Secure
summary: >-
  Buys one product as a guest with a test card that succeeds without 3DS,
  and checks that the store creates an order and shows the confirmation page.
  Use it as the baseline before you test a negative payment scenario.
tags: [checkout, payment, happy-path, guest]
compatible_profiles: [demo-store]
expected_outcome: order_placed

params:
  product_path:
    type: string
    default: /products/ceramic-mug
    description: Path of the product page to buy, relative to the target base URL.
  quantity:
    type: integer
    default: 1
    minimum: 1
    maximum: 5
    description: Number of units to add to the cart.
  card:
    type: test_card
    default: stripe/visa-success
    description: Id of a test card from list_scenarios.test_cards. The card must have the behaviour "success".
    constraints:
      behaviour: success

data:
  customer: customers/tr-guest.yaml

timeouts:
  step_ms: 15000
  run_ms: 120000

ignore:
  network:
    - url: "**/favicon.ico"

steps:
  - id: cart
    title: Add the product to the cart
    include: fragments/add-to-cart.yaml
    with:
      product_path: "{{params.product_path}}"
      quantity: "{{params.quantity}}"

  - id: checkout
    title: Start a guest checkout and fill the address
    include: fragments/guest-contact-address.yaml

  - id: card
    title: Fill the card form
    include: fragments/fill-card.yaml

  - id: submit_payment
    title: Submit the payment
    click: { role: button, name: { matches: "^Pay " } }
    expect:
      - response: { method: POST, url: "**/api/payments", status: 200 }
    on_failure:
      hint: The payment API rejected a card that must succeed. Check the payment provider test mode.

outcome:
  - id: confirmation_page_shown
    visible: { role: heading, name: { matches: "thank you" } }
    timeout_ms: 20000
  - id: on_success_url
    url: { matches: "**/checkout/success**" }
  - id: order_created
    response: { method: POST, url: "**/api/orders", status: 201 }
  - id: cart_empty
    text: { test_id: cart-count, equals: "0" }
