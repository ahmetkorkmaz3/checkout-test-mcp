# yaml-language-server: $schema=../../schemas/scenario.schema.json
#
# Full example scenario. Target: the bundled demo store (examples/demo-store),
# which uses a mock payment provider that copies the Stripe test-mode 3DS flow.
# No card numbers appear in this file. The scenario refers to a test card by id,
# and the server resolves the id from the built-in test card registry.

schema_version: 1

id: card-3ds-challenge-fail
title: Card payment fails when the 3D Secure challenge is rejected
summary: >-
  Buys one product as a guest with a 3DS test card that requires a challenge,
  rejects the challenge, and checks that the store shows a decline message,
  keeps the cart, and creates no order.
tags: [checkout, payment, 3ds, negative, guest]

# Target profiles this scenario can run against. A target in the config file
# declares its profile. list_scenarios uses this to show valid combinations.
compatible_profiles: [demo-store]

# One word the agent can compare against. Also used by compare_runs.
expected_outcome: payment_declined

# Shown to the agent in list_scenarios. Every param needs a description.
params:
  product_path:
    type: string
    default: /products/ceramic-mug
    description: Path of the product page to buy, relative to the target base URL.
  quantity:
    type: integer
    default: 1
    minimum: 1
    maximum: 5
    description: Number of units to add to the cart.
  card:
    type: test_card
    default: stripe/3ds2-challenge-required
    description: >-
      Id of a test card from list_scenarios.test_cards. The card must have the
      behaviour "challenge_required", or the scenario stops at validation.
    constraints:
      behaviour: challenge_required

# Named test data files. Paths are relative to the repository test-data folder.
# Values are available as {{data.<name>.<field>}}.
data:
  customer: customers/tr-guest.yaml

timeouts:
  step_ms: 15000 # default for each step. options.timeout_multiplier scales it.
  run_ms: 180000 # hard limit for the full run.

# Noise filters. Matching console messages and requests are recorded,
# but they never count as failures and never show as "relevant".
ignore:
  console:
    - pattern: "Download the React DevTools"
  network:
    - url: "**/analytics/**"
    - url: "**/favicon.ico"

steps:
  - id: cart
    title: Add the product to the cart
    include: fragments/add-to-cart.yaml
    with:
      product_path: "{{params.product_path}}"
      quantity: "{{params.quantity}}"

  - id: checkout
    title: Start a guest checkout and fill the address
    include: fragments/guest-contact-address.yaml

  - id: card
    title: Fill the card form
    include: fragments/fill-card.yaml

  - id: accept_terms
    title: Accept the terms
    check: { label: I accept the terms }
    on_failure:
      hint: The terms checkbox is missing. The store can have a new payment page layout.

  - id: submit_payment
    title: Submit the payment
    click: { role: button, name: { matches: "^Pay " } }
    expect:
      - visible:
          within: { frame: { css: "iframe[name^='three-ds-challenge']" } }
          locator: { role: button, name: Fail authentication }
        timeout_ms: 30000
    on_failure:
      hint: >-
        No 3DS challenge appeared. The card can be wrong for this scenario,
        or the checkout skipped 3DS. A skipped 3DS is a probable regression.

  - id: reject_challenge
    title: Reject the 3D Secure challenge
    within:
      frame: { css: "iframe[name^='three-ds-challenge']" }
    click: { role: button, name: Fail authentication }

# Checked after the last step. Each check is reported on its own.
outcome:
  - id: decline_message_shown
    text: { role: alert, matches: "(declined|reddedildi)" }
    timeout_ms: 20000
  - id: still_on_checkout
    url: { matches: "**/checkout/**" }
  - id: no_order_created
    no_response: { method: POST, url: "**/api/orders", status: "2xx" }
  - id: cart_kept
    text: { test_id: cart-count, equals: "{{params.quantity}}" }
