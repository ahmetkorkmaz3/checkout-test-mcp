# yaml-language-server: $schema=../../../schemas/fragment.schema.json
schema_version: 1
kind: fragment
id: demo-guest-contact-address
description: >-
  Starts a guest checkout and fills the contact and address form.
  The including scenario needs a "customer" data file.
steps:
  - id: start_checkout
    title: Go to checkout as a guest
    click: { role: link, name: Checkout }
    then:
      - click: { role: button, name: Continue as guest }
    expect:
      - url: { matches: "**/checkout/**" }

  - id: fill_form
    title: Fill the contact and address form
    fill_form:
      - field: { label: Email }
        value: "{{data.customer.email}}"
      - field: { label: Full name }
        value: "{{data.customer.full_name}}"
      - field: { label: Phone }
        value: "{{data.customer.phone}}"
      - field: { label: Address }
        value: "{{data.customer.address_line}}"
      - field: { label: City }
        select: "{{data.customer.city}}"
      - field: { label: District }
        select: "{{data.customer.district}}"
    then:
      - click: { role: button, name: Continue to payment }
    expect:
      - visible: { role: heading, name: Payment }
