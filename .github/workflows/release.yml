name: Release

# The tag `vX.Y.Z` must match the version in package.json, manifest.json, and server.json.
# npm trusted publishing must list this file (release.yml) as the workflow of the package.
on:
  push:
    tags: ["v*"]
  # Run it by hand on a tag to finish the steps after a failed npm publish. Pick the tag as the ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Check that the tag matches the versions in the files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for file in package.json manifest.json server.json; do
            version="$(node -p "require('./$file').version")"
            if [ "$TAG" != "v$version" ]; then
              echo "Tag $TAG does not match $file version $version" >&2
              exit 1
            fi
          done
          server_package_version="$(node -p "require('./server.json').packages[0].version")"
          if [ "$TAG" != "v$server_package_version" ]; then
            echo "Tag $TAG does not match the package version in server.json ($server_package_version)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  publish:
    name: Publish
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # npm trusted publishing and the MCP Registry OIDC login
    env:
      # Update both values together. The hash comes from the checksums file of the same release.
      MCP_PUBLISHER_VERSION: v1.8.16
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later. Pin an exact version.
      - name: Install npm
        run: npm install -g npm@12.2.3
      - run: npm ci
      - run: npm run build
      # No NPM_TOKEN. The npm CLI trades the OIDC token for a short-lived publish token.
      # A re-run after a failure in a later step must not fail here: the version is already public.
      - name: Publish the package to npm
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm. Skip the publish."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""
      - name: Pack the Desktop extension
        run: npm run pack:mcpb
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "checkout-test-mcp-${TAG#v}.mcpb" --title "$TAG" --generate-notes --verify-tag
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output checksums.txt "$base_url/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum --check --strict -
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict -
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" checksums.txt
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish the server to the MCP Registry
        run: ./mcp-publisher publish
