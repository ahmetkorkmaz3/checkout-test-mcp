version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep exact pins. CLAUDE.md requires them.
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
